plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id "org.jetbrains.kotlin.jvm" version "2.3.20"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}


loom {
	splitEnvironmentSourceSets()

	mods {
		"steel-extractor" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		server {
			// Force single worker thread so thread-local biome cache is deterministic
			//vmArgs "-Dmax.bg.threads=1"
			// Disable structures so they don't affect block hashes
			//vmArgs "-DMC_DEBUG_ENABLED=true"
			//vmArgs "-DMC_DEBUG_DISABLE_STRUCTURES=true"
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
		vendor = JvmVendorSpec.ADOPTIUM
	}
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
}

tasks.withType(JavaExec).configureEach {
	executable = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(25)
	}.get().executablePath.asFile.absolutePath
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// Collection fixtures need JVM identity hashes in insertion order; keep this isolated
// from server/worldgen extraction so its JVM identity policy stays unchanged.
tasks.register('extractJavaBlockPosSets', JavaExec) {
    group = 'extraction'
    description = 'Extract OpenJDK 25 BlockPos HashSet test fixtures as JSON'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.steelextractor.extractors.JavaBlockPosSets'
    workingDir = layout.projectDirectory.dir('run').asFile
    doFirst {
        java.nio.file.Files.createDirectories(workingDir.toPath())
    }
    jvmArgs '--add-opens=java.base/java.util=ALL-UNNAMED',
            '-XX:+UnlockExperimentalVMOptions', '-XX:hashCode=3'
}

tasks.register('extractTntExplosionOrder', JavaExec) {
    group = 'extraction'
    description = 'Capture the vanilla TNT explosion-order fixture as JSON'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.steelextractor.extractors.TntExplosionOrder'
    workingDir = layout.projectDirectory.dir('run').asFile
    doFirst {
        java.nio.file.Files.createDirectories(workingDir.toPath())
    }
}

// Fixtures need their own JVMs (identity-hash flags, a separate GameTest server),
// so the normal extractor run launches them before starting the server.
tasks.named('runServer') {
    dependsOn 'extractJavaBlockPosSets', 'extractTntExplosionOrder'
}
